name: Verificar imagens públicas Supabase
on:
  push:
    branches:
      - entrega-professor-emprest-ai-20261105
    paths:
      - data/published-photos.json
      - scripts/verify-public-images.mjs
      - .github/workflows/verify-storage.yml
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar 12 imagens, URLs e SHA-256 publicamente
        run: node scripts/verify-public-images.mjs
